name: Backend CI

on:
  push:
    paths:
      - "Backend API/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "Backend API/backend/**"
      - ".github/workflows/backend.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Backend API/backend"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Typecheck
        run: bun run typecheck
